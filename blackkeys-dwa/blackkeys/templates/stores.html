<div class="mx-auto max-w-3xl px-4">
  <h1 class="mb-4 text-xl font-bold">Featured</h1>
  <div class="carousel carousel-start mb-8 gap-3 pb-2">
    {{#featured_stores}}
    <div class="carousel-item w-36">
      <div class="card card-sm w-full border border-base-300 bg-base-100">
        <figure class="{{tint_bg_class}} h-24 items-center justify-center p-4">
          <img src="{{logo_url}}" alt="{{name}} logo" class="max-h-full max-w-full object-contain" loading="lazy" />
        </figure>
        <div class="card-body gap-0 p-3">
          <p class="{{tint_text_class}} text-[10px] font-bold uppercase">{{category}}</p>
          <p class="text-sm font-semibold">{{name}}</p>
        </div>
      </div>
    </div>
    {{/featured_stores}}
  </div>

  <div class="mb-8 flex items-center gap-3">
    <span class="h-px flex-1 bg-gradient-to-r from-transparent to-base-300"></span>
    <span aria-hidden="true" class="text-primary">✦</span>
    <span class="h-px flex-1 bg-gradient-to-l from-transparent to-base-300"></span>
  </div>

  <div class="columns-2 gap-3">
    {{#feed_stores}}
    <div class="card card-sm mb-3 break-inside-avoid border border-base-300 bg-base-100">
      <figure class="{{tint_bg_class}} items-center justify-center p-4" style="height: {{image_height}}px">
        <img src="{{logo_url}}" alt="{{name}} logo" class="max-h-full max-w-full object-contain" loading="lazy" />
      </figure>
      <div class="card-body gap-1 p-3">
        <p class="{{tint_text_class}} text-[10px] font-bold uppercase">{{category}}</p>
        <p class="text-sm font-semibold">{{name}}</p>
        <p class="flex items-center gap-1 text-xs text-base-content/60">
          <span aria-hidden="true">📍</span>{{location}}
        </p>
        {{#blurb}}
        <p class="text-xs text-base-content/60">{{blurb}}</p>
        {{/blurb}}
      </div>
    </div>
    {{/feed_stores}}
  </div>
</div>
