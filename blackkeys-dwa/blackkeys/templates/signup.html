<div class="relative min-h-svh overflow-hidden">
  <video class="absolute inset-0 h-full w-full object-cover" autoplay muted loop playsinline preload="auto">
    <source src="/static/video/SignInBackground.mp4" type="video/mp4" />
  </video>
  <div class="absolute inset-0 bg-gradient-to-b from-black/65 via-black/10 to-black/75"></div>

  <div class="relative mx-auto flex min-h-svh w-full max-w-md flex-col px-5 py-8 sm:px-6">
    <div class="pt-6">{{> wordmark}}</div>

    <section class="glass mt-auto w-full rounded-[2rem] p-6 sm:p-8 lg:p-10">
    <div class="mb-8">
      <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Create your account</h1>
      <p class="mt-3 text-sm leading-6 opacity-70 sm:text-base">Set up your Blackkeys credentials to get started.</p>
    </div>

    {{#show_notice}}
    <div class="alert alert-{{notice_kind}} mb-6 rounded-2xl" role="status">
      <div>
        <div class="font-semibold">{{notice_title}}</div>
        <div class="text-sm">{{notice_message}}</div>
      </div>
    </div>
    {{/show_notice}}

    <form
      method="post"
      action="/signup/"
      hx-post="/signup/"
      hx-target="#auth-result"
      hx-swap="innerHTML"
      hx-disabled-elt="find button"
      class="space-y-5"
    >
      <label class="form-control w-full">
        <span class="label-text mb-2 font-semibold">Username</span>
        <input class="input input-bordered min-h-12 w-full rounded-2xl bg-base-100 px-4 text-base" name="username" value="{{username}}" autocomplete="username" autocapitalize="none" required />
      </label>
      <label class="form-control w-full">
        <span class="label-text mb-2 font-semibold">Email</span>
        <input class="input input-bordered min-h-12 w-full rounded-2xl bg-base-100 px-4 text-base" name="email" value="{{email}}" type="email" autocomplete="email" required />
      </label>
      <label class="form-control w-full">
        <span class="label-text mb-2 font-semibold">Password</span>
        <input class="input input-bordered min-h-12 w-full rounded-2xl bg-base-100 px-4 text-base" name="password" type="password" autocomplete="new-password" minlength="8" required />
      </label>
      <button class="btn btn-primary min-h-12 w-full rounded-2xl text-base" type="submit">
        <span class="htmx-indicator loading loading-spinner loading-sm" aria-hidden="true"></span>
        Create account
      </button>
    </form>
    <div id="auth-result" aria-live="polite"></div>
    <p class="mt-8 text-center text-sm opacity-70">Already registered? <a class="link link-primary font-semibold" href="/signin/">Sign in</a></p>
    </section>
  </div>
</div>
