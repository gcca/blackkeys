<!doctype html>
<html lang="en" data-theme="{{default_theme}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{app_name}} | {{title}}</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('blackkeys-dwa-theme');
        if (savedTheme) document.documentElement.dataset.theme = savedTheme;
      } catch (error) {}
    </script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx.org@4.0.0" integrity="sha384-BvJpBiO8Kh31EqtJe5DRIeWrHWnCGkwytKs9NKFi86Hhw96dEqdEMzZDeK9iEGTc" crossorigin="anonymous"></script>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content antialiased">
    <header class="sticky top-0 z-20 border-b border-base-300 bg-base-100/95 backdrop-blur">
      <nav class="navbar mx-auto min-h-14 max-w-6xl px-2 sm:px-4" aria-label="Main navigation">
        <div class="navbar-start">
          <a href="/" class="btn btn-ghost gap-2 px-2 text-base sm:text-lg" aria-label="Blackkeys home">
            <span class="flex size-8 items-center justify-center rounded-lg bg-primary font-black text-primary-content">B</span>
            <span class="hidden min-[23rem]:inline">{{app_name}}</span>
          </a>
        </div>
        <div class="navbar-end gap-1">
          <a href="/" class="btn btn-ghost btn-sm {{#home_active}}btn-active{{/home_active}}">Home</a>
          <a href="/signin/" class="btn btn-ghost btn-sm {{#signin_active}}btn-active{{/signin_active}}">Sign in</a>
          <a href="/signup/" class="btn btn-primary btn-sm {{#signup_active}}btn-active{{/signup_active}}">Sign up</a>
        </div>
      </nav>
    </header>
    <main>
      {{{content}}}
    </main>
    <footer class="mx-auto max-w-6xl px-4 py-8 text-center text-sm opacity-60">
      A simple home for Blackkeys.
    </footer>
  </body>
</html>
