app = 'blackkeys-ws'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  TURSO_LOCAL_PATH = '/app/blackkeys.db'
  TZ = 'UTC'

[processes]
  app = 'ws:app --host=0.0.0.0 --port=8000 --single-process'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 2
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthcheck'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
