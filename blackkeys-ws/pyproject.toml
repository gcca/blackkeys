[project]
name = "blackkeys"
version = "0.0.1"
description = "Default template for PDM package"
authors = [
    {name = "gcca",email = "git@gcca.dev"},
]
dependencies = [
    "sanic>=25.12.1",
    "pylibmc>=1.6.3",
    "argon2-cffi>=25.1.0",
    "flatbuffers>=25.12.19",
    "aio-pika>=10.0.1",
    "httpx2>=2.12.0",
    "pyturso>=0.7.2",
    "sentry-sdk>=2.69.1",
]
requires-python = "==3.13.*"
readme = "README.md"
license = {text = "AGPL-GPL-3.0-or-later"}


[tool.pdm]
distribution = false

[tool.pdm.scripts]
turso-validate_schema = "sanic ws:app exec turso-validate_schema"
turso-init_schema = "sanic ws:app exec turso-init_schema"
turso-push_schema = "sanic ws:app exec turso-push_schema"
turso-pull_schema = "sanic ws:app exec turso-pull_schema"

[tool.isort]
profile = "black"
line_length = 80
known_first_party = ["blackkeys"]
