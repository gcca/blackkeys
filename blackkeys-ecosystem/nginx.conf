worker_processes 1;
error_log /tmp/blackkeys-ecosystem-nginx.error.log notice;
pid /tmp/blackkeys-ecosystem-nginx.pid;
daemon off;

events {
    worker_connections 64;
}

http {
    access_log /tmp/blackkeys-ecosystem-nginx.access.log;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        location = / {
            return 302 /dwa/;
        }

        location = /dwa {
            return 302 /dwa/;
        }

        location = /api {
            return 302 /api/;
        }

        location /dwa/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Accept-Encoding "";
            sub_filter_once off;
            sub_filter 'href="/' 'href="/dwa/';
            sub_filter 'action="/' 'action="/dwa/';
            sub_filter 'hx-get="/' 'hx-get="/dwa/';
            sub_filter 'hx-post="/' 'hx-post="/dwa/';
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8001/;
        }
    }
}
