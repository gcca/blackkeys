app = 'blackkeys-memcached-ws'
primary_region = 'ord'
kill_signal = 'SIGTERM'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  strategy = 'rolling'
  max_unavailable = 0.25

[env]
  TZ = 'UTC'

[processes]
  01 = 'memcached'
  02 = 'memcached'
  03 = 'memcached'
  04 = 'memcached'
  05 = 'memcached'

[checks]
  [checks.memcached]
    port = 11211
    type = 'tcp'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    processes = ['01', '02', '03', '04', '05']

[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1536mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1536

[[metrics]]
  port = 9100
  path = '/metrics'
  processes = ['01', '02', '03', '04', '05']

[[metrics]]
  port = 9150
  path = '/metrics'
  processes = ['01', '02', '03', '04', '05']
