app = 'blackkeys-assets-bo'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[checks]
  [checks.health]
    port = 8000
    type = 'http'
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthcheck'

  [checks.node_exporter]
    port = 9100
    type = 'tcp'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[metrics]]
  port = 9100
  path = '/metrics'
