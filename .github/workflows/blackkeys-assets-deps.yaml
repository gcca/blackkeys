name: blackkeys-assets deps

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gcca/blackkeys
  TAG: assets-deps

jobs:
  image:
    name: Build and Push Deps Image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hash go.sum
        shell: bash
        run: echo "LOCK_SHA256=$(sha256sum blackkeys-assets/go.sum | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: blackkeys-assets
          file: blackkeys-assets/deps/Dockerfile
          target: deps
          push: true
          platforms: linux/${{ matrix.arch }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=go.sum-sha256:${{ env.LOCK_SHA256 }}
          cache-from: type=gha,scope=blackkeys-assets-deps-${{ matrix.arch }}
          cache-to: type=gha,scope=blackkeys-assets-deps-${{ matrix.arch }},mode=max

  manifest:
    name: Publish Multi-Arch Deps Manifest
    runs-on: ubuntu-latest
    needs: image

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            "$IMAGE:$TAG-amd64" \
            "$IMAGE:$TAG-arm64"
