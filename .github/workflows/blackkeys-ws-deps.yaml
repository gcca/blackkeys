name: blackkeys-ws deps

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gcca/blackkeys-ws:deps

jobs:
  image:
    name: Build and Push Deps Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hash pdm.lock
        shell: bash
        run: echo "LOCK_SHA256=$(sha256sum blackkeys-ws/pdm.lock | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: gcca
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: blackkeys-ws
          file: blackkeys-ws/deps/Dockerfile
          target: deps
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/plaza-san-miguel/blackkeys
            org.opencontainers.image.revision=pdm.lock-sha256:${{ env.LOCK_SHA256 }}
          cache-from: type=gha,scope=blackkeys-ws-deps
          cache-to: type=gha,mode=max,scope=blackkeys-ws-deps
