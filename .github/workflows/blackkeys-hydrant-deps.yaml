name: blackkeys-hydrant deps

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/gcca/blackkeys
  TAG: hydrant-deps

jobs:
  image:
    name: Build and Push Deps Image (amd64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hash deps/Dockerfile
        shell: bash
        run: echo "DEPS_SHA256=$(sha256sum blackkeys-hydrant/deps/Dockerfile | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: blackkeys-hydrant
          file: blackkeys-hydrant/deps/Dockerfile
          target: deps
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=deps/Dockerfile-sha256:${{ env.DEPS_SHA256 }}
          cache-from: type=gha,scope=blackkeys-hydrant-deps
          cache-to: type=gha,scope=blackkeys-hydrant-deps,mode=max
